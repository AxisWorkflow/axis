# axis:production-only - lives only on the public Axis repository; Axis removes it from a new project at first startup.
# Axis has no package manifests (standard-library Python and shell), so only the pinned GitHub Actions are watched.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
