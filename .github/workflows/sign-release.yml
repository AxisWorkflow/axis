# axis:production-only - keyless signatures for exact uploaded release assets.
name: Sign release assets
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to sign
        required: true
        type: string
permissions: {}
concurrency:
  group: sign-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  sign:
    if: github.repository == 'AxisWorkflow/axis' && (github.event_name == 'release' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: AxisWorkflow/axis
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: sigstore/cosign-installer@b9c35392b7c1401bcc77d30c9b07cf4b1c7a7b07 # pinned installer
        with:
          cosign-release: v3.1.4
      - name: Download exact published assets and sign
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]{2}$ ]]
          python3 -c 'import os; assert tuple(map(int,os.environ["RELEASE_TAG"][1:].split("."))) >= (3,8)'
          mkdir payload
          cd payload
          # The release event can precede the two individual asset uploads.
          for attempt in {1..30}; do
            if gh release download "$RELEASE_TAG" --pattern axis-project.zip --pattern axis-project.zip.sha256 --clobber; then break; fi
            sleep 10
          done
          test -f axis-project.zip
          test -f axis-project.zip.sha256
          # Verify the checksum relationship without executing checksum-file text.
          python3 - <<'CHECK'
          import hashlib,re
          from pathlib import Path
          raw=Path('axis-project.zip.sha256').read_text()
          match=re.fullmatch(r'([a-f0-9]{64})  axis-project\.zip\n?',raw)
          assert match and hashlib.sha256(Path('axis-project.zip').read_bytes()).hexdigest()==match[1]
          CHECK
          for asset in axis-project.zip axis-project.zip.sha256; do
            if gh release download "$RELEASE_TAG" --pattern "$asset.sigstore"; then
              verified=false
              for ref in refs/heads/main "refs/tags/$RELEASE_TAG"; do
                if cosign verify-blob "$asset" --bundle "$asset.sigstore" \
                  --certificate-identity "https://github.com/AxisWorkflow/axis/.github/workflows/sign-release.yml@$ref" \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com; then verified=true; break; fi
              done
              test "$verified" = true
            else
              cosign sign-blob --yes "$asset" --bundle "$asset.sigstore"
              cosign verify-blob "$asset" --bundle "$asset.sigstore" \
                --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com
              gh release upload "$RELEASE_TAG" "$asset.sigstore"
            fi
          done
