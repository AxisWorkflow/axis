name: Feature request
description: A concrete change you want in Axis. Open-ended ideas go to Discussions > Ideas.
title: "[Feature]: "
type: Feature
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Easiest route: type `^feedback` in your Axis session.
        Describe the problem first; the maintainers decide how to build it. Pull requests are accepted only from maintainers.
        Issues are public. By submitting, you agree that the Axis maintainers may use the text of your request to improve Axis.
  - type: textarea
    id: axis-header
    attributes:
      label: Axis report header
      description: Filled in by ^feedback. Leave empty if you are filing by hand.
      render: text
  - type: input
    id: axis-version
    attributes:
      label: Axis version
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you were trying to do and what got in the way. Observed facts only.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Requested change
      description: What Axis should do differently.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
  - type: textarea
    id: duplicates
    attributes:
      label: Related issues or discussions searched
  - type: textarea
    id: analysis
    attributes:
      label: Analysis (not verified)
      description: Optional design thoughts, clearly unconfirmed.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: This request contains no secrets, personal data or private project content.
          required: true
# axis:production-only - lives only on the public Axis repository; Axis removes it from a new project at first startup.
